apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-assignment-ingress
  namespace: it-assignment
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: assignment.sikshasathi.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assignment-service
                port:
                  number: 80
