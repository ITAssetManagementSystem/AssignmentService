replicaCount: 1

image:
  repository: devacr301225.azurecr.io/assignment-service
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

env:
  SERVER_PORT: "8080"

  # Database (converted from ASSIGNMENT_DB_URL)
  DB_URL: jdbc:postgresql://dev-postgres301225.postgres.database.azure.com:5432/assignmentdb
  DB_USERNAME: pgadmin
  DB_PASSWORD: Strong@123 # ⚠️ move to Secret later

  # Inter-service communication
  ASSET_SERVICE_BASE_URL: http://asset-service.it-asset.svc.cluster.local
  EMPLOYEE_SERVICE_BASE_URL: http://employee-service.it-employee.svc.cluster.local

ingress:
  enabled: true
  className: azure/application-gateway
  host: assignment.sikshasathi.tech
  sslRedirect: "true"
  sslCertificate: wildcard-sikshasathi-tech

health:
  path: /
